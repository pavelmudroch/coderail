# bun lint currently requires Bun canary; see README.md for the verified revision.
[fmt]
tabWidth = 4
printWidth = 100
singleQuote = true
ignorePatterns = ["assets/", "bin/"]
sortImports = true

[lint]
maxWarnings = 0
ignorePatterns = ["assets/", "bin/"]

[lint.rules]
curly = ["error", "all"]
"bun/format" = "error"
# Deno checks globals and resolves Deno's import map, jsr: and URL imports.
"no-undef" = "off"
# Preserve the project's existing fallthrough policy.
"no-fallthrough" = "off"

# Preserve explicit rules and recommended checks from the previous Deno configuration.
"@typescript-eslint/explicit-function-return-type" = ["error", { allowExpressions = true }]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-unused-vars" = "error"
"no-shadow-restricted-names" = "error"
"no-sparse-arrays" = "error"
"@typescript-eslint/no-non-null-asserted-optional-chain" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/consistent-type-imports" = ["error", { disallowTypeAnnotations = false }]
"@typescript-eslint/adjacent-overload-signatures" = "error"
"@typescript-eslint/ban-types" = "error"
"@typescript-eslint/no-empty-interface" = "error"
"no-inner-declarations" = "error"
"no-new-symbol" = "error"
"require-await" = "error"
