# Coderail configuration file, lines starting with "#" are comments.
# Example:
# default_harness = codex

# Add your verification configuration here.
# Example:
# Optional global actions (place before rule entries):
# [verify]
# pre = [["mkdir", "-p", "coverage"]]
# post = [["rm", "-rf", ".mutation-tmp"]]
#
# [[verify.rules]]
# pattern = src/${path:**}/${file:*}.ts
# commands = [
#   ["command", "argument_1", "argument_2"]
# ]

[verify]
pre = [
    ["rm", "-rf", "coverage"],
    ["rm", "-rf", ".mutasaurus"]
]

[[verify.rules]]
pattern = "${path:**}/${file:*}.ts"
commands = [
    ["deno", "lint", "--fix", "${path}/${file}.ts"],
    ["deno", "fmt", "${path}/${file}.ts"]
]

[[verify.rules]]
pattern = "src/${path:**}/${file:*}.ts"
commands = [
    ["deno", "test", "-A", "--coverage", "--coverage-raw-data-only", "tests/${path}/${file}.test.ts"],
    ["deno", "coverage", "--detailed", "--include=./src/${path}/${file}.ts"],
]
requires = ["tests/${path}/${file}.test.ts"]

[[verify.rules]]
pattern = "tests/${path:**}/${file:*}.test.ts"
commands = [
    ["deno", "test", "-A", "--coverage", "--coverage-raw-data-only", "tests/${path}/${file}.test.ts"],
    ["deno", "coverage", "--detailed", "--include=./src/${path}/${file}.ts"],
    ["deno", "run", "-A", "tools/mutate.ts", "./tests/${path}/${file}.test.ts", "./src/${path}/${file}"]
]
requires = ["src/${path}/${file}.ts"]