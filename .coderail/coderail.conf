[verify]
pre = [
    ["rm", "-rf", "coverage"],
    ["rm", "-rf", ".mutasaurus"]
]

[[verify.rules]]
pattern = "${path:**/}${file:*}.ts"
commands = [
    ["bun", "lint", "--fix", "${path}${file}.ts"]
]

[[verify.rules]]
pattern = "src/${path:**/}${file:*}.ts"
commands = [
    ["deno", "test", "-A", "--coverage", "--coverage-raw-data-only", "tests/${path}${file}.test.ts"],
    ["deno", "coverage", "--detailed", "--include=./src/${path}${file}.ts"],
]
requires = ["tests/${path}${file}.test.ts"]

[[verify.rules]]
pattern = "tests/${path:**/}${file:*}.test.ts"
commands = [
    ["deno", "test", "-A", "--coverage", "--coverage-raw-data-only", "tests/${path}${file}.test.ts"],
    ["deno", "coverage", "--detailed", "--include=./src/${path}${file}.ts"],
    ["deno", "run", "-A", "tools/internal/mutate.ts", "./tests/${path}${file}.test.ts", "./src/${path}${file}"]
]
requires = ["src/${path}${file}.ts"]

# Maintainer tool contracts have no corresponding application source file.
[[verify.rules]]
pattern = "tests/tools/${file:*}.test.ts"
commands = [
    ["deno", "test", "-A", "tests/tools/${file}.test.ts"]
]
